name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build portable app
        shell: pwsh
        run: ./src/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/MouseNudge"
      - name: Verify movement, settings, timer, and instance controls
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/MouseNudge-verification.txt"
          $app = "$env:RUNNER_TEMP/MouseNudge/MouseNudge.exe"
          $test = Start-Process -FilePath $app -ArgumentList @('--self-test', ('"' + $report + '"')) -Wait -PassThru
          Get-Content -LiteralPath $report
          if ($test.ExitCode -ne 0) { throw "Verification failed: $($test.ExitCode)" }
