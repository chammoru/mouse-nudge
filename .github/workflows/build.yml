name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build portable app
        shell: pwsh
        run: ./src/build.ps1 -Platform '${{ matrix.platform }}' -OutputDirectory "$env:RUNNER_TEMP/MouseNudge"
      - name: Verify movement, settings, timer, and instance controls
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/MouseNudge-verification.txt"
          $app = "$env:RUNNER_TEMP/MouseNudge/MouseNudge.exe"
          $test = Start-Process -FilePath $app -ArgumentList @('--self-test', ('"' + $report + '"')) -Wait -PassThru
          Get-Content -LiteralPath $report
          if ($test.ExitCode -ne 0) { throw "Verification failed: $($test.ExitCode)" }
      - name: Verify DPI layout, monitor changes, and small screens
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/MouseNudge-layout"
          $test = Start-Process -FilePath "$env:RUNNER_TEMP/MouseNudge/MouseNudge.exe" -ArgumentList @('--layout-test', ('"' + $report + '"')) -Wait -PassThru
          Get-Content -LiteralPath "$report/result.txt"
          if ($test.ExitCode -ne 0) { throw "Layout verification failed: $($test.ExitCode)" }

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: windows-2025
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check whether this version is already published
        id: version
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath ./src/MouseNudge.cs -Raw
          $match = [regex]::Match($source, 'AssemblyVersion\("(\d+\.\d+\.\d+)\.\d+"\)')
          if (-not $match.Success) { throw 'No assembly version found.' }
          $tag = 'v' + $match.Groups[1].Value
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing releases.' }
          $publish = @($releases | Where-Object tagName -eq $tag).Count -eq 0
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Build, verify, and package portable release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./src/package.ps1 -OutputDirectory "$env:RUNNER_TEMP/release"
      - name: Publish release and checksums
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $folder = "$env:RUNNER_TEMP/release"
          gh release create $env:RELEASE_TAG "$folder/MouseNudge.exe" "$folder/MouseNudge-$env:RELEASE_TAG-windows.zip" "$folder/SHA256SUMS.txt" --target $env:GITHUB_SHA --title "Mouse Nudge $env:RELEASE_TAG" --notes-file "$folder/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
